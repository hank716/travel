<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF4E8" />
  <title>旅程規劃 · Trip Planner</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="page topbar-inner">
      <div class="brand">🧳 <span>旅程規劃</span></div>
      <div id="tripBadge" class="trip-badge" hidden>
        <span id="tripBadgeTitle"></span>
        <button id="switchTrip" class="btn btn--ghost btn--sm" type="button">切換行程</button>
      </div>
    </div>
  </header>

  <main class="page" style="padding: 28px 0 64px;">
    <!-- 載入中 -->
    <div id="bootView" class="card center-card"><p class="status">載入中…</p></div>

    <!-- 加入 / 建立行程 -->
    <section id="joinView" class="join-wrap" hidden>
      <div class="card join-card">
        <h1 class="join-title">開始你的旅行</h1>
        <p class="status">輸入行程碼加入夥伴，或建立一趟新行程。</p>

        <div class="seg" role="tablist">
          <button class="seg-btn is-active" data-tab="join" type="button">加入行程</button>
          <button class="seg-btn" data-tab="create" type="button">建立新行程</button>
        </div>

        <!-- 加入 -->
        <form id="joinForm" class="form" data-pane="join">
          <label>行程碼
            <input name="code" placeholder="例如 JP4F2K" autocomplete="off"
                   style="text-transform:uppercase; letter-spacing:.18em; font-weight:700;" required />
          </label>
          <label>你的名字
            <input name="name" placeholder="小明" maxlength="20" required />
          </label>
          <button class="btn" type="submit">加入</button>
        </form>

        <!-- 建立 -->
        <form id="createForm" class="form" data-pane="create" hidden>
          <label>行程名稱
            <input name="title" placeholder="2026 春 東京大阪" maxlength="40" required />
          </label>
          <div class="row">
            <label>出發日 <input name="start" type="date" /></label>
            <label>回程日 <input name="end" type="date" /></label>
          </div>
          <label>結算基準幣別
            <select name="base"></select>
          </label>
          <label>啟用幣別（點選加入／移除，之後仍可改）
            <div id="createCurrencyChips" class="chip-pick"></div>
            <div class="add-currency">
              <select id="createAddCurrency" class="inline-select"></select>
              <button id="createAddCurrencyBtn" class="btn btn--ghost btn--sm" type="button">＋ 加入</button>
            </div>
            <small class="status">基準幣別會自動納入。</small>
          </label>
          <label>你的名字
            <input name="name" placeholder="小明" maxlength="20" required />
          </label>
          <button class="btn" type="submit">建立並進入</button>
        </form>

        <p id="joinError" class="status" data-ok="false" hidden></p>
      </div>
    </section>

    <!-- 行程主畫面 -->
    <section id="appView" hidden>
      <div class="card trip-head">
        <div class="trip-head-main">
          <h1 id="tripTitle" style="margin:0 0 4px;"></h1>
          <p id="tripDates" class="status"></p>
        </div>
        <div class="trip-code-box">
          <span class="status">行程碼（分享給夥伴）</span>
          <div class="trip-code-row">
            <code id="tripCode" class="trip-code"></code>
            <button id="copyCode" class="btn btn--ghost btn--sm" type="button">複製</button>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2 class="card-title">同行夥伴 <span id="memberCount" class="status"></span></h2>
          <div id="memberList" class="member-list"></div>
        </div>

        <div class="card">
          <h2 class="card-title">幣別設定</h2>
          <p class="status">基準：
            <select id="baseSelect" class="inline-select"></select>
          </p>
          <div id="currencyPills" class="currency-pills"></div>
          <div class="add-currency">
            <select id="addCurrencySelect" class="inline-select"></select>
            <button id="addCurrencyBtn" class="btn btn--ghost btn--sm" type="button">＋ 加入幣別</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2 class="card-title">行程規劃</h2>
          <button id="addItemBtn" class="btn btn--sm" type="button">＋ 新增項目</button>
        </div>
        <div id="dayTabs" class="day-tabs"></div>
        <div id="itineraryList" class="itinerary-list"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2 class="card-title">地圖</h2>
          <a id="mapOpen" class="btn btn--ghost btn--sm" target="_blank" rel="noopener" href="#">在 Google Maps 開啟</a>
        </div>
        <div id="mapTitle" class="status" style="margin-bottom:8px;">點行程項目的「地圖」即可在此顯示</div>
        <iframe id="mapFrame" class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps?q=Japan&output=embed"></iframe>
      </div>

      <div class="feature-tabs" style="margin-top:6px;">
        <span class="feature-tab is-done">加入行程 ✓</span>
        <span class="feature-tab is-done">行程規劃 ✓</span>
        <span class="feature-tab is-done">即時匯率 ✓</span>
        <span class="feature-tab is-todo">多幣別記帳 · Phase 3</span>
        <span class="feature-tab is-todo">天氣 · Phase 4</span>
        <span class="feature-tab is-todo">AI 助手 · Phase 5</span>
      </div>
    </section>

    <!-- 新增/編輯項目 Modal -->
    <div id="itemModal" class="modal" hidden>
      <div class="modal-box card">
        <div class="card-head">
          <h2 id="itemModalTitle" class="card-title">新增項目</h2>
          <button id="itemModalClose" class="btn btn--ghost btn--sm" type="button">✕</button>
        </div>
        <form id="itemForm" class="form">
          <input type="hidden" name="id" />
          <label>標題
            <input name="title" placeholder="淺草寺、一蘭拉麵…" maxlength="60" required />
          </label>
          <div class="row">
            <label>日期 <input name="day_date" type="date" /></label>
            <label>分類
              <select name="category">
                <option value="景點">景點</option>
                <option value="餐廳">餐廳</option>
                <option value="交通">交通</option>
                <option value="住宿">住宿</option>
                <option value="購物">購物</option>
                <option value="其他">其他</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>開始 <input name="start_time" type="time" /></label>
            <label>結束 <input name="end_time" type="time" /></label>
          </div>
          <label>地點 / 地圖搜尋字
            <input name="location_name" placeholder="例如：東京晴空塔" maxlength="80" />
          </label>
          <label>備註
            <textarea name="notes" rows="2" placeholder="訂位、票價、交通方式…"></textarea>
          </label>
          <div class="row" style="justify-content:flex-end;">
            <button id="itemDeleteBtn" class="btn btn--ghost" type="button" hidden>刪除</button>
            <button class="btn" type="submit">儲存</button>
          </div>
          <p id="itemError" class="status" data-ok="false" hidden></p>
        </form>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
