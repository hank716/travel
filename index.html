<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF4E8" />
  <title>旅程規劃 · Trip Planner</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="page topbar-inner">
      <button id="navToggle" class="nav-toggle" type="button" aria-label="選單">☰</button>
      <div class="brand">🧳 <span>旅程規劃</span></div>
      <div id="tripBadge" class="trip-badge" hidden>
        <span id="tripBadgeTitle"></span>
      </div>
    </div>
  </header>

  <!-- 側邊抽屜導航 -->
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="brand">🧳 <span id="drawerTripTitle">旅程規劃</span></div>
    </div>
    <nav class="drawer-nav">
      <button class="nav-item" data-page="overview" type="button">🏠 總覽</button>
      <button class="nav-item" data-page="itinerary" type="button">🗺️ 行程</button>
      <button class="nav-item" data-page="expenses" type="button">💰 記帳</button>
      <button class="nav-item" data-page="weather" type="button">⛅ 天氣</button>
    </nav>
    <div class="drawer-foot">
      <button id="switchTrip" class="btn btn--ghost btn--sm" type="button">切換行程</button>
    </div>
  </aside>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <main class="page" style="padding: 28px 0 64px;">
    <!-- 載入中 -->
    <div id="bootView" class="card center-card"><p class="status">載入中…</p></div>

    <!-- 建立 / 加入(登入) 行程 Modal -->
    <div id="tripModal" class="modal" hidden>
      <div class="modal-box card">
        <div class="card-head">
          <h2 class="card-title">行程</h2>
          <button id="tripModalClose" class="btn btn--ghost btn--sm" type="button">✕</button>
        </div>

        <div class="seg" role="tablist">
          <button class="seg-btn is-active" data-tab="join" type="button">加入 / 登入</button>
          <button class="seg-btn" data-tab="create" type="button">建立新行程</button>
        </div>

        <!-- 加入 / 登入 -->
        <form id="joinForm" class="form" data-pane="join">
          <label>行程碼
            <input name="code" placeholder="例如 JP4F2K" autocomplete="off"
                   style="text-transform:uppercase; letter-spacing:.18em; font-weight:700;" required />
          </label>
          <button id="rosterBtn" class="btn btn--ghost btn--sm" type="button">查看名單</button>
          <div id="rosterPick" class="chip-pick" hidden></div>
          <label>你的名字
            <input name="name" placeholder="從名單挑，或輸入新名字" maxlength="20" required />
          </label>
          <button class="btn" type="submit">加入 / 登入</button>
        </form>

        <!-- 建立 -->
        <form id="createForm" class="form" data-pane="create" hidden>
          <label>行程名稱
            <input name="title" placeholder="2026 春 東京大阪" maxlength="40" required />
          </label>
          <label>自訂行程碼（選填，留空自動產生）
            <input name="code" placeholder="例如 JAPAN26" maxlength="12" autocomplete="off"
                   style="text-transform:uppercase; letter-spacing:.12em;" />
            <small class="status">3–12 碼英文或數字。</small>
          </label>
          <div class="row">
            <label>出發日 <input name="start" type="date" /></label>
            <label>回程日 <input name="end" type="date" /></label>
          </div>
          <label>結算基準幣別
            <select name="base"></select>
          </label>
          <label>啟用幣別（點選加入／移除，之後仍可改）
            <div id="createCurrencyChips" class="chip-pick"></div>
            <div class="add-currency">
              <select id="createAddCurrency" class="inline-select"></select>
              <button id="createAddCurrencyBtn" class="btn btn--ghost btn--sm" type="button">＋ 加入</button>
            </div>
            <small class="status">基準幣別會自動納入。你就是這趟的管理員。</small>
          </label>
          <label>你的名字（管理員）
            <input name="name" placeholder="小明" maxlength="20" required />
          </label>
          <button class="btn" type="submit">建立並進入</button>
        </form>

        <p id="joinError" class="status" data-ok="false" hidden></p>
      </div>
    </div>

    <!-- 行程主畫面（4 個分頁，由 drawer 切換） -->
    <div id="appView" hidden>

      <!-- 總覽 -->
      <section class="view" id="view-overview">
        <!-- 行程中樞：我的行程 + 建立 + 加入/登入 -->
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">我的行程</h2>
            <div style="display:flex; gap:8px;">
              <button id="joinTripBtn" class="btn btn--ghost btn--sm" type="button">加入 / 登入</button>
              <button id="createTripBtn" class="btn btn--sm" type="button">＋ 建立</button>
            </div>
          </div>
          <div id="myTripsList" class="my-trips-list"></div>
        </div>

        <!-- 目前行程詳情（沒選行程時隱藏） -->
        <div id="overviewTripDetail">
          <div class="card trip-head">
            <div class="trip-head-main">
              <h1 id="tripTitle" style="margin:0 0 4px;"></h1>
              <p id="tripDates" class="status"></p>
            </div>
            <div class="trip-code-box">
              <span class="status">行程碼（分享給夥伴）</span>
              <div class="trip-code-row">
                <code id="tripCode" class="trip-code"></code>
                <button id="copyCode" class="btn btn--ghost btn--sm" type="button">複製</button>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-head">
                <h2 class="card-title">同行夥伴 <span id="memberCount" class="status"></span></h2>
                <button id="addMemberBtn" class="btn btn--ghost btn--sm" type="button" hidden>＋ 新增名字</button>
              </div>
              <div id="memberList" class="member-list"></div>
            </div>

            <div class="card">
              <h2 class="card-title">幣別設定</h2>
              <p class="status">基準：
                <select id="baseSelect" class="inline-select"></select>
              </p>
              <div id="currencyPills" class="currency-pills"></div>
              <div class="add-currency">
                <select id="addCurrencySelect" class="inline-select"></select>
                <button id="addCurrencyBtn" class="btn btn--ghost btn--sm" type="button">＋ 加入幣別</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 沒選行程時的提示 -->
        <div id="noTripHint" class="card" hidden>
          <p class="status">還沒有選擇行程。從上方「我的行程」進入一趟，或用「＋ 建立」「加入 / 登入」開始。</p>
        </div>
      </section>

      <!-- 行程 -->
      <section class="view" id="view-itinerary" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">行程規劃</h2>
            <button id="addItemBtn" class="btn btn--sm" type="button">＋ 新增項目</button>
          </div>
          <div id="dayTabs" class="day-tabs"></div>
          <div id="itineraryList" class="itinerary-list"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">地圖</h2>
            <a id="mapOpen" class="btn btn--ghost btn--sm" target="_blank" rel="noopener"
               href="https://www.google.com/maps">在 Google Maps 開啟行程</a>
          </div>
          <div id="mapTitle" class="status" style="margin-bottom:8px;">點行程項目的「地圖」即可在此顯示</div>
          <iframe id="mapFrame" class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
        </div>
      </section>

      <!-- 記帳 -->
      <section class="view" id="view-expenses" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">記帳</h2>
            <button id="addExpenseBtn" class="btn btn--sm" type="button">＋ 新增支出</button>
          </div>
          <div id="expenseSummary" class="expense-summary"></div>
          <div id="expenseList" class="expense-list"></div>
        </div>

        <div class="card">
          <h2 class="card-title">結算</h2>
          <p class="status">全部換算成基準幣別後計算。</p>
          <div id="balanceList" class="balance-list"></div>
          <h3 class="day-head" style="margin-top:16px;">建議轉帳</h3>
          <div id="settleList" class="settle-list"></div>
        </div>
      </section>

      <!-- 天氣 -->
      <section class="view" id="view-weather" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">天氣</h2>
            <button id="refreshWeather" class="btn btn--ghost btn--sm" type="button">重新整理</button>
          </div>
          <p id="weatherSubtitle" class="status">依行程地點即時取得 Open-Meteo 預報。</p>
          <div class="add-currency" style="margin:10px 0;">
            <input id="weatherManualInput" placeholder="或手動查城市，如 Tokyo / 京都" />
            <button id="weatherManualBtn" class="btn btn--ghost btn--sm" type="button">查詢</button>
          </div>
          <div id="forecastGrid" class="forecast-grid"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">✨ AI 天氣建議</h2>
            <button id="aiWeatherBtn" class="btn btn--sm" type="button">產生建議</button>
          </div>
          <div id="aiWeatherOut" class="ai-out">
            <p class="status">按「產生建議」讓 AI 依各日天氣給穿搭與行程提醒（雨天改室內等）。</p>
          </div>
        </div>
      </section>

    </div>

    <!-- 新增/編輯支出 Modal -->
    <div id="expenseModal" class="modal" hidden>
      <div class="modal-box card">
        <div class="card-head">
          <h2 id="expenseModalTitle" class="card-title">新增支出</h2>
          <button id="expenseModalClose" class="btn btn--ghost btn--sm" type="button">✕</button>
        </div>
        <form id="expenseForm" class="form">
          <input type="hidden" name="id" />
          <label>說明
            <input name="description" placeholder="拉麵、計程車、門票…" maxlength="60" />
          </label>
          <div class="row">
            <label>金額
              <input name="amount" type="number" step="any" min="0" inputmode="decimal" placeholder="0" required />
            </label>
            <label>幣別
              <select name="currency" id="expenseCurrency"></select>
            </label>
          </div>
          <div class="row">
            <label>付款人
              <select name="paid_by" id="expensePayer"></select>
            </label>
            <label>分類
              <select name="category">
                <option value="餐飲">🍜 餐飲</option>
                <option value="交通">🚆 交通</option>
                <option value="住宿">🏨 住宿</option>
                <option value="購物">🛍️ 購物</option>
                <option value="門票">🎟️ 門票</option>
                <option value="其他">✨ 其他</option>
              </select>
            </label>
          </div>
          <label>日期 <input name="spent_at" type="date" /></label>
          <label>分攤給（均分，點選加入／移除）
            <div id="splitMembers" class="chip-pick"></div>
          </label>
          <p id="splitHint" class="status"></p>
          <div class="row" style="justify-content:flex-end;">
            <button id="expenseDeleteBtn" class="btn btn--ghost" type="button" hidden>刪除</button>
            <button class="btn" type="submit">儲存</button>
          </div>
          <p id="expenseError" class="status" data-ok="false" hidden></p>
        </form>
      </div>
    </div>

    <!-- 新增/編輯項目 Modal -->
    <div id="itemModal" class="modal" hidden>
      <div class="modal-box card">
        <div class="card-head">
          <h2 id="itemModalTitle" class="card-title">新增項目</h2>
          <button id="itemModalClose" class="btn btn--ghost btn--sm" type="button">✕</button>
        </div>
        <form id="itemForm" class="form">
          <input type="hidden" name="id" />
          <label>標題
            <input name="title" placeholder="淺草寺、一蘭拉麵…" maxlength="60" required />
          </label>
          <div class="row">
            <label>日期 <input name="day_date" type="date" /></label>
            <label>分類
              <select name="category">
                <option value="景點">景點</option>
                <option value="餐廳">餐廳</option>
                <option value="交通">交通</option>
                <option value="住宿">住宿</option>
                <option value="購物">購物</option>
                <option value="其他">其他</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>開始 <input name="start_time" type="time" /></label>
            <label>結束 <input name="end_time" type="time" /></label>
          </div>
          <label>地點 / 地圖搜尋字
            <input name="location_name" placeholder="例如：東京晴空塔" maxlength="80" />
          </label>
          <label>備註
            <textarea name="notes" rows="2" placeholder="訂位、票價、交通方式…"></textarea>
          </label>
          <div class="row" style="justify-content:flex-end;">
            <button id="itemDeleteBtn" class="btn btn--ghost" type="button" hidden>刪除</button>
            <button class="btn" type="submit">儲存</button>
          </div>
          <p id="itemError" class="status" data-ok="false" hidden></p>
        </form>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
