<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="旅程規劃">
  <!-- 行李箱。與 tools/make-icons.py 是同一套幾何，改造型時兩邊要一起改。
       配色是橘底白箱（不是網站的米白底）：icon 常疊在深色分頁列或手機桌布上，
       米底橘箱在 16px 只會糊成一坨低對比的點。
       XML 註解裡不能出現連續兩個減號，所以這裡不寫 CSS 變數的前綴。 -->
  <rect width="64" height="64" rx="14" fill="#E66F4B"/>
  <!-- 提把（下半截被箱體蓋住）。5 單位粗，16px 才撐得住 -->
  <rect x="23" y="8" width="18" height="18" rx="8" fill="none" stroke="#FFF8EF" stroke-width="5"/>
  <!-- 箱體。刻意沒有箱腳：縮到 16px 時那兩隻只會變成兩點髒污 -->
  <rect x="9" y="18" width="46" height="37" rx="8" fill="#FFF8EF"/>
  <!-- 中央束帶 -->
  <rect x="26.5" y="18" width="11" height="37" fill="#E66F4B"/>
  <!-- 扣具 -->
  <rect x="23" y="30" width="18" height="11" rx="5" fill="#BD4F32"/>
</svg>
