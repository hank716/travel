<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="旅程規劃">
  <!-- 行李箱。配色沿用 css/app.css 的 accent / accent-dark / bg
       （XML 註解裡不能出現連續兩個減號，所以這裡不寫 CSS 變數的前綴） -->
  <rect width="64" height="64" rx="14" fill="#FFF8EF"/>
  <!-- 提把 -->
  <path d="M24 17v-3a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v3" fill="none" stroke="#BD4F32" stroke-width="4" stroke-linecap="round"/>
  <!-- 箱體 -->
  <rect x="11" y="17" width="42" height="35" rx="7" fill="#E66F4B"/>
  <!-- 中央束帶 -->
  <rect x="27" y="17" width="10" height="35" fill="#BD4F32"/>
  <!-- 扣具 -->
  <rect x="25" y="30" width="14" height="7" rx="3" fill="#FFE0D4"/>
  <!-- 箱腳 -->
  <rect x="17" y="52" width="6" height="4" rx="2" fill="#BD4F32"/>
  <rect x="41" y="52" width="6" height="4" rx="2" fill="#BD4F32"/>
</svg>
